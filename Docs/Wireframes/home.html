<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Ibico</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="container topbar-inner">
      <div class="topbar-left">
        <a href="login.html" class="brand teal"><span class="brand-dot"></span>Ibico</a>
      </div>
    </div>
  </header>

  <main class="auth-shell">
    <div class="auth-box">
      <div class="card card-pad">
        <div class="auth-eyebrow">Ibico</div>
        <h1 class="auth-title">Bem-vindo de volta</h1>
        <p class="auth-sub">Escolha como deseja acessar a plataforma</p>

        <div class="role-toggle" id="loginRoleToggle">
          <div class="role-card" data-role="contratante">
            <div class="role-icon">💼</div>
            <span>Quero Contratar</span>
          </div>
          <div class="role-card" data-role="trabalhador">
            <div class="role-icon">🛠️</div>
            <span>Quero Trabalhar</span>
          </div>
        </div>

        <form id="loginForm">
          <div class="field">
            <label for="email">E-mail corporativo ou pessoal</label>
            <input class="input" type="email" id="email" placeholder="seuemail@ibico.com.br" required>
          </div>

          <div class="field">
            <div class="flex-between" style="margin-bottom:6px;">
              <label for="senha" style="margin-bottom:0;">Senha</label>
              <a href="#" class="hint-link">Esqueceu a senha?</a>
            </div>
            <div class="input-with-icon">
              <input class="input" type="password" id="senha" placeholder="••••••••" required>
              <button type="button" class="input-icon-btn" data-toggle-password="senha" aria-label="Mostrar senha">👁️</button>
            </div>
          </div>

          <div class="checkbox-row" style="margin-bottom:20px;">
            <input type="checkbox" id="lembrar">
            <label for="lembrar" style="margin:0;font-weight:500;">Lembrar de mim neste dispositivo</label>
          </div>

          <button type="submit" class="btn btn-teal btn-block">Entrar na Plataforma →</button>
        </form>

        <p class="foot-note">Não tem uma conta? <a href="cadastro.html" class="hint-link">Criar uma conta gratuitamente</a></p>

        <div class="divider-or">ou entre com</div>
        <div class="oauth-row">
          <button type="button" class="btn btn-ghost">🔴 Google</button>
          <button type="button" class="btn btn-ghost">💼 LinkedIn</button>
        </div>
      </div>

      <p class="foot-note">🔒 Conexão segura AES-256</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="foot-copy">© 2024 Ibico Intermediação Ltda. Todos os direitos reservados.</span>
    </div>
  </footer>
</div>

<script src="js/app.js"></script>
<script>
  initRoleToggle('#loginRoleToggle');
  initAuthRedirect('loginForm');
</script>
</body>
</html>
